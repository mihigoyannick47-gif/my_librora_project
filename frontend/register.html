<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIBRORA | Register</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a href="index.html" class="brand" aria-label="LIBRORA home">
          <img src="assets/logo.svg" alt="LIBRORA logo" />
        </a>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-outline">Login</a>
        </div>
      </div>
    </header>

    <main class="form-shell">
      <section class="auth-card">
        <img src="assets/logo.svg" alt="LIBRORA logo" width="180" />
        <h1>Join LIBRORA</h1>
        <p>Create your member account and start borrowing books.</p>

        <div id="formMessage" class="alert" role="alert"></div>

        <form id="registerForm" class="auth-form">
          <div class="field">
            <label for="full_name">Full name</label>
            <input id="full_name" name="full_name" type="text" placeholder="Jane Doe" required />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" placeholder="(555) 123-4567" />
          </div>

          <div class="field">
            <label for="address">Address</label>
            <input id="address" name="address" type="text" placeholder="123 Main Street" />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Minimum 6 characters" required />
          </div>

          <button class="btn btn-primary" type="submit">Create Account</button>
        </form>

        <p class="inline-note">Already a member? <a href="login.html">Log in</a></p>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
