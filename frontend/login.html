<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIBRORA | Login</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a href="index.html" class="brand" aria-label="LIBRORA home">
          <img src="assets/logo.svg" alt="LIBRORA logo" />
        </a>
        <div class="nav-actions">
          <a href="register.html" class="btn btn-outline">Create account</a>
        </div>
      </div>
    </header>

    <main class="form-shell">
      <section class="auth-card">
        <img src="assets/logo.svg" alt="LIBRORA logo" width="180" />
        <h1>Welcome back</h1>
        <p>Access your bookshelf and borrowing history.</p>

        <div id="formMessage" class="alert" role="alert"></div>

        <form id="loginForm" class="auth-form">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" required />
          </div>

          <button class="btn btn-primary" type="submit">Login to LIBRORA</button>
        </form>

        <p class="inline-note">Need an account? <a href="register.html">Register here</a></p>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
